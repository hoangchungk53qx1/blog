<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block;border-radius:20px" role="img" aria-label="Cây task có cấu trúc và task không có cấu trúc">
<defs>
<linearGradient id="tasktreebg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1822"/><stop offset="1" stop-color="#2a1f2b"/></linearGradient>
<linearGradient id="tasktreesw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9B4A"/><stop offset="1" stop-color="#F05138"/></linearGradient>
<linearGradient id="tasktreekt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9A0FF"/><stop offset="1" stop-color="#7F52FF"/></linearGradient>
<marker id="tasktreearr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cfc3b8"/></marker>
</defs>
<rect width="1200" height="630" rx="24" fill="url(#tasktreebg)"/>
<text x="60" y="70" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="32" font-weight="800" fill="#e8dccf" text-anchor="start" >Structured và unstructured</text>
<text x="60" y="104" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="20" font-weight="400" fill="#a99a8e" text-anchor="start" >Structured: parent chờ các child task, cancel parent thì child bị cancel theo.</text>
<rect x="40" y="130" width="700" height="470" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
<text x="64" y="168" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="18" font-weight="700" fill="#8FE3A0" text-anchor="start" letter-spacing="3">STRUCTURED</text>
<rect x="220.0" y="190" width="340" height="60" rx="12" fill="#141117" stroke="#8FE3A0" stroke-width="2" stroke-opacity="1"/>
<text x="390" y="218" font-family="SF Mono,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e8dccf" text-anchor="middle" >loadScreen()</text>
<text x="390" y="240" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#a99a8e" text-anchor="middle" >async let / coroutineScope { }</text>
<rect x="70.0" y="330" width="200" height="60" rx="12" fill="#141117" stroke="#FFB98A" stroke-width="2" stroke-opacity="1"/>
<text x="170" y="358" font-family="SF Mono,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e8dccf" text-anchor="middle" >user</text>
<text x="170" y="380" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#a99a8e" text-anchor="middle" >async let · async { }</text>
<rect x="290.0" y="330" width="200" height="60" rx="12" fill="#141117" stroke="#FFB98A" stroke-width="2" stroke-opacity="1"/>
<text x="390" y="358" font-family="SF Mono,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e8dccf" text-anchor="middle" >feed</text>
<text x="390" y="380" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#a99a8e" text-anchor="middle" >async let · async { }</text>
<rect x="510.0" y="330" width="200" height="60" rx="12" fill="#141117" stroke="#CDB6FF" stroke-width="2" stroke-opacity="1"/>
<text x="610" y="358" font-family="SF Mono,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e8dccf" text-anchor="middle" >ads</text>
<text x="610" y="380" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#a99a8e" text-anchor="middle" >addTask · async { }</text>
<line x1="330" y1="250" x2="190" y2="328" stroke="#8FE3A0" stroke-width="2.5" stroke-opacity="1" marker-end="url(#tasktreearr)"/>
<line x1="390" y1="250" x2="390" y2="328" stroke="#8FE3A0" stroke-width="2.5" stroke-opacity="1" marker-end="url(#tasktreearr)"/>
<line x1="450" y1="250" x2="590" y2="328" stroke="#8FE3A0" stroke-width="2.5" stroke-opacity="1" marker-end="url(#tasktreearr)"/>
<rect x="180.0" y="470" width="420" height="60" rx="12" fill="#141117" stroke="#8FE3A0" stroke-width="2" stroke-opacity="1" stroke-dasharray="8 6"/>
<text x="390" y="498" font-family="SF Mono,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e8dccf" text-anchor="middle" >} ← chưa ra khỏi scope</text>
<text x="390" y="520" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#a99a8e" text-anchor="middle" >khi child task chưa xong</text>
<line x1="170" y1="390" x2="300" y2="468" stroke="#6f6470" stroke-width="2" stroke-opacity="1" stroke-dasharray="5 5" marker-end="url(#tasktreearr)"/>
<line x1="390" y1="390" x2="390" y2="468" stroke="#6f6470" stroke-width="2" stroke-opacity="1" stroke-dasharray="5 5" marker-end="url(#tasktreearr)"/>
<line x1="610" y1="390" x2="480" y2="468" stroke="#6f6470" stroke-width="2" stroke-opacity="1" stroke-dasharray="5 5" marker-end="url(#tasktreearr)"/>
<text x="64" y="578" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#8FE3A0" text-anchor="start" >cancel parent ⇒ cancel cả 3 child · error đi ngược lên parent</text>
<rect x="770" y="130" width="390" height="470" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
<text x="794" y="168" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="18" font-weight="700" fill="#FF7A7A" text-anchor="start" letter-spacing="3">UNSTRUCTURED</text>
<rect x="815.0" y="190" width="300" height="60" rx="12" fill="#141117" stroke="#6f6470" stroke-width="2" stroke-opacity="1"/>
<text x="965" y="218" font-family="SF Mono,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e8dccf" text-anchor="middle" >onAppear()</text>
<text x="965" y="240" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#a99a8e" text-anchor="middle" >hàm đã return</text>
<rect x="815.0" y="330" width="300" height="60" rx="12" fill="#141117" stroke="#FFD479" stroke-width="2" stroke-opacity="1" stroke-dasharray="8 6"/>
<text x="965" y="358" font-family="SF Mono,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e8dccf" text-anchor="middle" >Task { … }</text>
<text x="965" y="380" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#a99a8e" text-anchor="middle" >scope.launch(ở scope khác)</text>
<rect x="815.0" y="450" width="300" height="60" rx="12" fill="#141117" stroke="#FF7A7A" stroke-width="2" stroke-opacity="1" stroke-dasharray="8 6"/>
<text x="965" y="478" font-family="SF Mono,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e8dccf" text-anchor="middle" >Task.detached { … }</text>
<text x="965" y="500" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#a99a8e" text-anchor="middle" >GlobalScope.launch { }</text>
<line x1="965" y1="250" x2="965" y2="328" stroke="#FFD479" stroke-width="2.5" stroke-opacity="1" stroke-dasharray="6 6" marker-end="url(#tasktreearr)"/>
<text x="980" y="290" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#FFD479" text-anchor="start" >kế thừa actor, priority,</text>
<text x="980" y="306" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#FFD479" text-anchor="start" >task-local… nhưng</text>
<text x="980" y="322" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="400" fill="#FFD479" text-anchor="start" >không có owner</text>
<text x="794" y="556" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#FF7A7A" text-anchor="start" >không ai chờ, không tự cancel:</text>
<text x="794" y="580" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#FF7A7A" text-anchor="start" >bạn phải giữ handle và cancel()</text>
</svg>
