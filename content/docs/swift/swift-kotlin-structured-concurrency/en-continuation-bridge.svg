<text x="360" y="566" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#FFB98A" text-anchor="middle" >The continuation does not resume on cancel:</text>
<text x="360" y="590" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#FFB98A" text-anchor="middle" >the old API must call back (usually with an error)</text>
<text x="915" y="566" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#CDB6FF" text-anchor="middle" >The continuation resumes itself on cancel;</text>
<text x="915" y="590" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#CDB6FF" text-anchor="middle" >later resume calls are ignored</text>
