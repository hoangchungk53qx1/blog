<text x="84" y="580" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#8FE3A0" text-anchor="start" >+ Sendable kiểm tra dữ liệu qua ranh giới domain</text>
